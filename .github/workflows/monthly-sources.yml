name: Monthly official-source link review
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 3 * *'
permissions:
  contents: read
jobs:
  source-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_sources.py --remote
